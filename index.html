<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrew Roper</title>
  <style>
    body{font-family:Calibri,sans-serif;margin:0;background:#f4f4f4;color:#000}
    header{background:#2563eb;color:white;padding:2rem;text-align:center}
    main{max-width:900px;margin:auto;padding:2rem}
    .card{background:white;padding:1.5rem;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    footer{text-align:center;padding:1rem;color:#666}
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website</h1>
    <p>By Andrew Roper</p>
  </header>

  <main>
    <div class="card">
      <h2>About</h2>
      <p>This is a place for me to share my projects.</p>
      <button onclick="showMessage()">Click Me</button>
      <p id="message"></p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Andrew Roper</p>
  </footer>

  <script>
    function showMessage(){
      document.getElementById('message').textContent='kys';
    }
  </script>
</body>
</html>
